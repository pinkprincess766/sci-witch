[workspace]
resolver = "2"
members = [
    "crates/sciwhisper-core",
    "crates/sciwhisper-asr",
    "crates/sciwhisper-cli",
    "crates/sciwhisper-eval",
    "crates/sciwhisper-grammar",
]
default-members = [
    "crates/sciwhisper-core",
    "crates/sciwhisper-asr",
    "crates/sciwhisper-cli",
    "crates/sciwhisper-eval",
]

[workspace.package]
version = "0.1.1-rc1"
edition = "2021"
# Minimum compiler declared for this workspace. Matches rust-toolchain.toml.
# `numbers.rs` uses `is_multiple_of` (stable since 1.87); this pin is 1.98
# because that is the compiler the suite is run on.
rust-version = "1.98"
license = "Apache-2.0"
authors = ["sci-witch contributors"]
description = "Compiler from transcribed Russian scientific speech to a typed structure (research)"

[workspace.dependencies]
sciwhisper-core = { path = "crates/sciwhisper-core" }
sciwhisper-asr = { path = "crates/sciwhisper-asr" }
sciwhisper-eval = { path = "crates/sciwhisper-eval" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"
cpal = "0.15"
hound = "3.5"
sha2 = "0.10"
libc = "0.2"
