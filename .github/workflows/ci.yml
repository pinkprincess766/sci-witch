name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: Install Linux audio dependency (microphone capture in sciwhisper-asr)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test (no Whisper, no microphone)
        run: cargo test --workspace --locked
      # Release turns off overflow checks and debug assertions; AGENTS.md
      # runs the core this way too, so arithmetic that only wraps in release
      # is caught here and not first on someone's machine.
      - name: Test core (release)
        run: cargo test -p sciwhisper-core --release --locked
      - name: Build
        run: cargo build --workspace --locked
