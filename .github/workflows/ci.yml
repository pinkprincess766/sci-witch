name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libayatana-appindicator3-dev libx11-dev libxtst-dev libxi-dev
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (no Whisper, no microphone)
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows tray binary
        run: cargo build -p sciwhisper-cli --release
      - name: Run Windows self-test
        run: target/release/sciwhisper.exe self-test
      - name: Assemble portable Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item target/release/sciwhisper.exe artifact/
          Copy-Item packaging/windows/SciWhisper-Test.cmd artifact/
          Copy-Item packaging/windows/SciWhisper.cmd artifact/
          Copy-Item packaging/windows/SciWhisper-App.ps1 artifact/
          Copy-Item packaging/windows/SciWhisper-Settings.cmd artifact/
          Copy-Item packaging/windows/SciWhisper-Settings.ps1 artifact/
          Copy-Item packaging/windows/README-WINDOWS.txt artifact/
          Copy-Item assets/branding/SciWhisper-wink-broom-sand-v1.ico artifact/SciWhisper.ico
          Copy-Item README.md, LICENSE, NOTICE, DATA_LICENSE.md artifact/
      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: sciwhisper-windows
          path: artifact/
