name: Preview release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build and check
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace
          cargo build --release --target aarch64-apple-darwin -p sciwhisper-cli
          file target/aarch64-apple-darwin/release/sciwhisper | grep -q arm64

      - name: Assemble application archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="bundle/sci-witch-macOS-arm64-${version}"
          mkdir -p "$root/docs/images"
          SCIWHISPER_BIN="target/aarch64-apple-darwin/release/sciwhisper" \
            packaging/macos/package-app.sh "$root/SciWhisper.app"
          cp README.md LICENSE NOTICE DATA_LICENSE.md CHANGELOG.md "$root/"
          cp docs/TESTING_RU.md docs/PRIVACY.md docs/KNOWN_LIMITATIONS.md "$root/docs/"
          cp docs/images/si-witch-recording.gif "$root/docs/images/"
          ditto -c -k --sequesterRsrc --keepParent "$root" \
            "bundle/SciWhisper-${version}-macOS-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: bundle/SciWhisper-*-macOS-arm64.zip

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and check
        shell: pwsh
        run: |
          cargo build --release -p sciwhisper-cli
          target/release/sciwhisper.exe self-test
          $bytes = [System.IO.File]::ReadAllBytes("target/release/sciwhisper.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw "Expected x64 PE machine 0x8664, got 0x$($machine.ToString('X4'))"
          }

      - name: Assemble application archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $root = "bundle/sci-witch-Windows-x64-$version"
          New-Item -ItemType Directory -Force "$root/docs/images" | Out-Null
          Copy-Item target/release/sciwhisper.exe $root
          Copy-Item packaging/windows/SciWhisper.cmd, packaging/windows/SciWhisper-App.ps1 $root
          Copy-Item packaging/windows/SciWhisper-Settings.cmd, packaging/windows/SciWhisper-Settings.ps1 $root
          Copy-Item packaging/windows/SciWhisper-Test.cmd, packaging/windows/README-WINDOWS.txt $root
          Copy-Item assets/branding/SciWhisper-wink-broom-sand-v1.ico "$root/SciWhisper.ico"
          Copy-Item README.md, LICENSE, NOTICE, DATA_LICENSE.md, CHANGELOG.md, SECURITY.md, CONTRIBUTING.md $root
          Copy-Item docs/TESTING_RU.md, docs/PRIVACY.md, docs/KNOWN_LIMITATIONS.md, docs/grammar.md "$root/docs"
          Copy-Item docs/images/si-witch-windows-settings-mockup.png, docs/images/si-witch-recording.gif "$root/docs/images"
          Compress-Archive -Path $root -DestinationPath "bundle/SciWhisper-$version-Windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: bundle/SciWhisper-*-Windows-x64.zip

  release:
    name: Publish GitHub release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*.zip
