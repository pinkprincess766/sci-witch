name: paper

# Builds paper/main.tex into a PDF and attaches it to the run. The numbers in
# the paper come from research/results (paper/numbers.tex, checked by
# crates/sciwhisper-eval/tests/paper_numbers.rs in the ci workflow), so a
# change there rebuilds the paper too.
on:
  push:
    paths:
      - "paper/**"
      - "research/results/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - "research/results/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_lualatex: false
      - name: Attach the PDF
        uses: actions/upload-artifact@v4
        with:
          name: sci-witch-paper
          path: paper/main.pdf
          if-no-files-found: error
