name: Ошибка SciWhisper
description: Сообщить о воспроизводимой ошибке без публикации чувствительного аудио
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за проверку. Не прикладывайте личные разговоры и чужое аудио.

  - type: input
    id: version
    attributes:
      label: Версия SciWhisper
      placeholder: v0.1.0-preview
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      options:
        - Windows 11
        - Windows 10
        - macOS Apple Silicon
        - macOS Intel
        - Linux
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Домен
      options:
        - Chemistry
        - Mathematics
        - Physics
        - Auto / не уверен
    validations:
      required: true

  - type: textarea
    id: spoken
    attributes:
      label: Что было произнесено или введено
    validations:
      required: true

  - type: textarea
    id: whisper
    attributes:
      label: Raw-текст Whisper
      description: Оставьте пустым, если использовалась команда format.

  - type: textarea
    id: actual
    attributes:
      label: Фактический результат SciWhisper
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true

  - type: textarea
    id: repeat
    attributes:
      label: Как повторить ошибку
      description: Укажите команду, renderer, модель и наличие фонового шума.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Приватность
      options:
        - label: В отчёте нет секретов, личных разговоров и чужого аудио.
          required: true
