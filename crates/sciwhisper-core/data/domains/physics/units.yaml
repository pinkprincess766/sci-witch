schema_version: 2
# Every unit lists the forms Russian numerals govern: «один паскаль»
# (nominative singular), «два паскаля» (genitive singular) and «пять
# паскалей» (genitive plural), plus the nominative plural where a speaker
# would use it. A unit missing one of them is not a smaller vocabulary, it
# is a unit that silently fails on four numbers out of five —
# `unit_declension.rs` fails the build when a form is absent.
#
# `dimension` uses the seven SI base symbols M L T I Θ N J with optional
# exact rational powers (`M L T^-2`, `L^1/2`, `1` for dimensionless).
# Prefixes change the scale only, never the dimension.
si_base:
  - symbol: м
    forms: {one: метр, few: метра, many: метров}
    gender: m
    latex: r"\mathrm{m}"
    dimension: L
    spoken: [метр, метра, метров, метры]
  - symbol: кг
    forms: {one: килограмм, few: килограмма, many: килограммов}
    gender: m
    latex: r"\mathrm{kg}"
    dimension: M
    spoken: [килограмм, килограмма, килограммов, килограммы]
  - symbol: с
    forms: {one: секунда, few: секунды, many: секунд}
    gender: f
    latex: r"\mathrm{s}"
    dimension: T
    spoken: [секунда, секунды, секунд, секунду]
  - symbol: А
    forms: {one: ампер, few: ампера, many: амперов}
    gender: m
    latex: r"\mathrm{A}"
    dimension: I
    spoken: [ампер, ампера, амперов, амперы]
  - symbol: К
    forms: {one: кельвин, few: кельвина, many: кельвинов}
    gender: m
    latex: r"\mathrm{K}"
    dimension: Θ
    spoken: [кельвин, кельвина, кельвинов, кельвины]
  - symbol: моль
    forms: {one: моль, few: моля, many: молей}
    gender: m
    latex: r"\mathrm{mol}"
    dimension: N
    spoken: [моль, моля, молей, моли]
  - symbol: кд
    forms: {one: кандела, few: канделы, many: кандел}
    gender: f
    latex: r"\mathrm{cd}"
    dimension: J
    spoken: [кандела, канделы, кандел, канделу]
derived:
  - symbol: Н
    forms: {one: ньютон, few: ньютона, many: ньютонов}
    gender: m
    dimension: M L T^-2
    spoken: [ньютон, ньютона, ньютонов, ньютоны]
  - symbol: Дж
    forms: {one: джоуль, few: джоуля, many: джоулей}
    gender: m
    dimension: M L^2 T^-2
    spoken: [джоуль, джоуля, джоулей, джоули]
  - symbol: Вт
    forms: {one: ватт, few: ватта, many: ваттов}
    gender: m
    dimension: M L^2 T^-3
    spoken: [ватт, ватта, ваттов, ватты]
  - symbol: Па
    forms: {one: паскаль, few: паскаля, many: паскалей}
    gender: m
    dimension: M L^-1 T^-2
    spoken: [паскаль, паскаля, паскалей, паскали]
  - symbol: Кл
    forms: {one: кулон, few: кулона, many: кулонов}
    gender: m
    dimension: I T
    spoken: [кулон, кулона, кулонов, кулоны]
  - symbol: В
    forms: {one: вольт, few: вольта, many: вольтов}
    gender: m
    dimension: M L^2 T^-3 I^-1
    spoken: [вольт, вольта, вольтов, вольты]
  - symbol: Ом
    forms: {one: ом, few: ома, many: омов}
    gender: m
    dimension: M L^2 T^-3 I^-2
    spoken: [ом, ома, омов, омы]
  - symbol: Гц
    forms: {one: герц, few: герца, many: герц}
    gender: m
    dimension: T^-1
    spoken: [герц, герца, герцы]
  # Units outside the SI coherent set that a chemist says every day. They
  # have no `scale_exponent` of their own where the ratio to the SI unit is
  # not a power of ten (an hour is 3600 s, a litre is 10⁻³ m³): the field
  # is a decimal exponent by contract, and a wrong one would make
  # `units::equivalent` print a wrong number.
  - symbol: г
    forms: {one: грамм, few: грамма, many: граммов}
    gender: m
    base: кг
    scale_exponent: -3
    dimension: M
    spoken: [грамм, грамма, граммов, граммы]
  - symbol: л
    forms: {one: литр, few: литра, many: литров}
    gender: m
    dimension: L^3
    spoken: [литр, литра, литров, литры]
  # «часы» (a clock) is deliberately absent: no numeral takes it, and it is
  # an ordinary noun that would otherwise count as scientific evidence.
  - symbol: ч
    forms: {one: час, few: часа, many: часов}
    gender: m
    dimension: T
    spoken: [час, часа, часов]
  - symbol: мин
    forms: {one: минута, few: минуты, many: минут}
    gender: f
    dimension: T
    spoken: [минута, минуты, минут, минуту]
  # Only the Celsius degree is a unit here. A bare «градус» is an angle in
  # «синус тридцати градусов» and a temperature in «минус пять градусов»,
  # and the two have different dimensions (1 and Θ), so guessing either one
  # would put a false claim into the document (a temperature nobody said,
  # or a false dimension warning on an angle). The bare word stays words.
  # «по Цельсию» is the same unit spoken the other common way.
  - symbol: °C
    forms: {one: градус Цельсия, few: градуса Цельсия, many: градусов Цельсия}
    gender: m
    dimension: Θ
    spoken:
      - градус цельсия
      - градуса цельсия
      - градусов цельсия
      - градусы цельсия
      - градус по цельсию
      - градуса по цельсию
      - градусов по цельсию
      - градусы по цельсию
prefixes:
  - prefix: н
    spoken: [нано]
    factor: 1e-9
  - prefix: мк
    spoken: [микро]
    factor: 1e-6
  - prefix: м
    spoken: [милли]
    factor: 1e-3
  - prefix: с
    spoken: [санти]
    factor: 1e-2
  - prefix: к
    spoken: [кило]
    factor: 1e3
  - prefix: М
    spoken: [мега]
    factor: 1e6
  - prefix: Г
    spoken: [гига]
    factor: 1e9
composed:
  - spoken: [нанометр, нанометра, нанометров, нанометры]
    symbol: нм
    forms: {one: нанометр, few: нанометра, many: нанометров}
    gender: m
    base: м
    scale_exponent: -9
    dimension: L
  - spoken: [миллиметр, миллиметра, миллиметров, миллиметры]
    symbol: мм
    forms: {one: миллиметр, few: миллиметра, many: миллиметров}
    gender: m
    base: м
    scale_exponent: -3
    dimension: L
  - spoken: [сантиметр, сантиметра, сантиметров, сантиметры]
    symbol: см
    forms: {one: сантиметр, few: сантиметра, many: сантиметров}
    gender: m
    base: м
    scale_exponent: -2
    dimension: L
  - spoken: [километр, километра, километров, километры]
    symbol: км
    forms: {one: километр, few: километра, many: километров}
    gender: m
    base: м
    scale_exponent: 3
    dimension: L
  - spoken: [миллисекунда, миллисекунды, миллисекунд, миллисекунду]
    symbol: мс
    forms: {one: миллисекунда, few: миллисекунды, many: миллисекунд}
    gender: f
    base: с
    scale_exponent: -3
    dimension: T
  - spoken: [килогерц, килогерца, килогерцы]
    symbol: кГц
    forms: {one: килогерц, few: килогерца, many: килогерц}
    gender: m
    base: Гц
    scale_exponent: 3
    dimension: T^-1
  - spoken: [мегагерц, мегагерца, мегагерцы]
    symbol: МГц
    forms: {one: мегагерц, few: мегагерца, many: мегагерц}
    gender: m
    base: Гц
    scale_exponent: 6
    dimension: T^-1
  - spoken: [миллиграмм, миллиграмма, миллиграммов, миллиграммы]
    symbol: мг
    forms: {one: миллиграмм, few: миллиграмма, many: миллиграммов}
    gender: m
    base: кг
    scale_exponent: -6
    dimension: M
  - spoken: [микрограмм, микрограмма, микрограммов, микрограммы]
    symbol: мкг
    forms: {one: микрограмм, few: микрограмма, many: микрограммов}
    gender: m
    base: кг
    scale_exponent: -9
    dimension: M
  - spoken: [миллилитр, миллилитра, миллилитров, миллилитры]
    symbol: мл
    forms: {one: миллилитр, few: миллилитра, many: миллилитров}
    gender: m
    base: л
    scale_exponent: -3
    dimension: L^3
  - spoken: [микролитр, микролитра, микролитров, микролитры]
    symbol: мкл
    forms: {one: микролитр, few: микролитра, many: микролитров}
    gender: m
    base: л
    scale_exponent: -6
    dimension: L^3
operators:
  per: [на, в]
  times: [умножить]
power:
  squared: [в квадрате, квадрате]
  cubed: [в кубе]
