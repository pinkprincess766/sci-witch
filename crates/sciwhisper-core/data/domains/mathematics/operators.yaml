schema_version: 1
binary:
  plus: [плюс]
  minus: [минус]
  times: [умножить, умножить на, умноженное на, умноженная на, умноженный на, умноженные на, умножения]
  divide: [разделить, разделить на, поделить, поделить на, делить на, деленное на, делённое на, деленного на, делённого на, деленной на, делённой на, делить]
  equal: [равно, равен, равна, равняется]
  not_equal: [не равно]
  lt: [меньше]
  gt: [больше]
  le: [меньше или равно, не больше]
  ge: [больше или равно, не меньше]
  plus_minus: [плюс-минус, плюс минус]
unary:
  minus: [минус]
  abs: [модуль]
  factorial: [факториал]
  sin: [синус от, синуса от, синус, синуса, sin]
  cos: [косинус от, косинуса от, косинус, косинуса, cos]
  tan: [тангенс от, тангенса от, тангенс, тангенса, tg]
  cot: [котангенс от, котангенса от, котангенс, котангенса, ctg]
  ln: [натуральный логарифм от, натуральный логарифм, эл эн от, эл эн, ln]
  log: [логарифм от, логарифма от, логарифм, логарифма, log]
  exp: [экспонента от, экспоненту от, экспоненты от, экспоненциальная функция от, exp]
postfix_power:
  squared: [возвести в квадрат, в квадрате, в квадрат, квадрате]
  cubed: [возвести в куб, в кубе, в куб, кубе]
  degree: [в степени]
  inverse: [в минус первой, в минус первую]
delimiters:
  fraction_start: [начало дроби, дробь]
  numerator: [в числителе, числитель]
  denominator: [в знаменателе, знаменатель]
  fraction_end: [конец дроби]
  power_start: [начало степени]
  power_end: [конец степени]
  paren_open: [открыть скобку, открывается скобка, скобка открыть]
  paren_close: [закрыть скобку, закрывается скобка, скобка закрыть, конец скобки]
  bracket_open: [открыть квадратную скобку]
  bracket_close: [закрыть квадратную скобку]
  brace_open: [открыть фигурную скобку]
  brace_close: [закрыть фигурную скобку]
  root_start: [начало корня]
  root_end: [конец корня]
  root: [корень из, корень]
  sum: [сумма]
  product: [произведение]
  integral: [интеграл]
  from: [от]
  to: [до]
  of_var: [по, под]
  sum_end: [конец суммы]
  product_end: [конец произведения]
  integral_end: [конец интеграла]
  subscript: [индекс, нижний индекс]
  vector: [вектор]
  infinity: [бесконечность, бесконечности]
  ellipsis: [многоточие]
  delta: [дельта]
  comma: [запятая]
  over: [на]
  # Calculus. These are single tokens, composed by the parser into a
  # derivative or a limit; there is no dictionary of whole sentences.
  derivative: [производная, производную, производной, производные, производных]
  partial: [частная, частную, частной, частные, частных]
  order: [порядка, порядке, порядок]
  and_by: [и по]
  limit: [предел, предела, пределу, пределы]
  limit_left: [слева, левый, левосторонний]
  limit_right: [справа, правый, правосторонний]
  limit_var: [при]
  tends_to: [стремящемся к, стремящейся к, стремящемуся к, стремящегося к, стремящихся к, стремится к, стремятся к, стремящемся, стремящейся, стремящемуся, стремящегося]
  function_filler: [функции, функция, функцию]
special:
  zero_eq: [равно нулю]
