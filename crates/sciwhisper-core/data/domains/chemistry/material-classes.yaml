schema_version: 1
# Ограниченная онтология классов материалов.
#
# Это НЕ композиционная номенклатура и НЕ IUPAC. «Феррит цинка» — устоявшееся
# название материала, а не систематическое имя, и вывести ZnFe₂O₄ из правил
# номенклатуры нельзя: структуру задаёт кристаллография, а не грамматика.
#
# Поэтому здесь перечислены ИМЕННО те катионы, для которых шаблон доказанно
# даёт единственную формулу. Правила «феррит любого металла» нет и быть не
# должно: у бария известны обе фазы — шпинельная BaFe₂O₄ и гексаферрит
# BaFe₁₂O₁₉, — поэтому само название «феррит бария» не задаёт единственной
# структуры, и выбрать за говорящего нельзя.
sources:
  pubchem_zinc_ferrite: https://pubchem.ncbi.nlm.nih.gov/compound/Iron-zinc-oxide-_Fe2ZnO4
classes:
  - id: spinel_ferrite
    # Слово, вводящее класс, во всех падежах, которые встречаются в диктовке.
    # Только единственное число. «Ферриты цинка» — разговор о классе
    # материалов, а не название одного вещества, и превращать его в формулу
    # нельзя. Родительный «феррита» нужен для «два феррита цинка».
    names: [феррит, феррита, ферритом, ферриту]
    # Прилагательная форма: «цинковый феррит».
    adjective_forms:
      - adjective: [цинковый, цинковая, цинковое]
        cation: Zn
    structure: "M(II)Fe2O4"
    # Скелет без катиона. Катион подставляется первым.
    skeleton:
      - symbol: Fe
        count: 2
      - symbol: O
        count: 4
    # Только эти катионы, только в этой степени окисления. Список — это и есть
    # условие однозначности: всё, чего в нём нет, приводит к отказу.
    allowed_cations:
      - symbol: Zn
        oxidation: 2
        source: pubchem_zinc_ferrite
    # Причины отказа, которые система обязана уметь назвать.
    refusals:
      cation_not_listed: >-
        шаблон шпинельного феррита подтверждён не для всех металлов; для
        неперечисленного катиона формула не выводится
      cation_multivalent: >-
        у многовалентного металла шаблон не задаёт единственную степень
        окисления, а значит и единственную формулу
