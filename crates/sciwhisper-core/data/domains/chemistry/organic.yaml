schema_version: 1
# Простейшая композиционная органика: углеводороды.
#
# Название углеводорода состоит из двух частей — приставка называет число
# атомов углерода, суффикс называет класс, — и молекулярная формула следует
# из них арифметически. Словарь готовых названий здесь не нужен и вреден:
# он покрывал метан…бутан и обрывался на пентане.
#
# ЧТО ЭТО НЕ ДЕЛАЕТ. Строится молекулярная формула, а не структура. У
# бутана и изобутана она одна (C4H10), у бут-1-ена и бут-2-ена — одна
# (C4H8). Структурные названия («изобутан», «2-метилпропан») не
# поддержаны и приводят к отказу, а не к формуле «похожего» вещества.
# Источники и границы — docs/development/CHEMISTRY_NOMENCLATURE_RU.md.

# Приставка → число атомов углерода. Закрытый список: за деканом начинаются
# формы, которые вслух почти не диктуют.
stems:
  - spoken: мет
    carbons: 1
  - spoken: эт
    carbons: 2
  - spoken: проп
    carbons: 3
  - spoken: бут
    carbons: 4
  - spoken: пент
    carbons: 5
  - spoken: гекс
    carbons: 6
  - spoken: гепт
    carbons: 7
  - spoken: окт
    carbons: 8
  - spoken: нон
    carbons: 9
  - spoken: дек
    carbons: 10
  # Перед «-ен» и «-ин» основа десяти углеродов пишется «дец»: децен,
  # децин. Это орфография русской номенклатуры, а не отдельное вещество,
  # поэтому та же цифра под другой основой.
  #
  # «Декен» и «декин» при этом тоже разбираются, потому что основа «дек»
  # никуда не делась. Это не догадка: у них ровно одно возможное чтение,
  # и отказ из-за орфографической детали потерял бы верное высказывание —
  # ровно как «феррит Zn» рядом с «феррит цинка».
  - spoken: дец
    carbons: 10

# Суффикс → класс. `hydrogens` задаёт формулу как 2n + delta, а
# `min_carbons` — то, ниже чего класс не существует: у алкена нужны два
# углерода, чтобы было между чем ставить двойную связь, а «метин» не
# существует вовсе, потому что дало бы CH0.
classes:
  - suffix: ан
    id: alkane
    delta: 2
    min_carbons: 1
  - suffix: ен
    id: alkene
    delta: 0
    min_carbons: 2
  - suffix: ин
    id: alkyne
    delta: -2
    min_carbons: 2

# Падежные окончания, которые встречаются в диктовке: «молекула метана»,
# «реагирует с пропаном». Список закрытый — это не морфология русского
# языка, а те три формы, которые реально произносят.
endings: ["", а, ом, у]
