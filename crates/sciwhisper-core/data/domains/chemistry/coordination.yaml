schema_version: 1
# Ограниченная композиционная грамматика координационных соединений и гидратов.
#
# Это НЕ парсер номенклатуры IUPAC. Реализовано ровно то, что перечислено
# ниже, и ничего сверх того; всё остальное обязано приводить к отказу, а не к
# правдоподобной догадке. Источники и границы — в
# docs/development/CHEMISTRY_NOMENCLATURE_RU.md.
#
# Слова в русской диктовке склеены: «гексацианоферрат» — одно слово, которое
# разбирается на приставку + лиганд + центр. Поэтому таблицы описывают
# фрагменты слова, а не отдельные слова.

# Числовые приставки. Служат и кратностью лиганда, и числом молекул воды в
# гидрате. Приставка «моно» разрешена, но кратность 1 при рендеринге не
# печатается.
prefixes:
  - spoken: моно
    value: 1
  - spoken: ди
    value: 2
  - spoken: три
    value: 3
  - spoken: тетра
    value: 4
  - spoken: пента
    value: 5
  - spoken: гекса
    value: 6
  - spoken: гепта
    value: 7
  - spoken: окта
    value: 8
  - spoken: нона
    value: 9
  - spoken: дека
    value: 10

# Лиганды описаны СВОЙСТВАМИ компонента, а не готовым соединением: фрагмент
# формулы, заряд и допустимая кратность. Именно это позволяет строить
# соединение композиционно, а не искать его целиком в словаре.
#
# ФОРМЫ НАЗВАНИЙ. Первая основа в `stems` — действующая форма по
# рекомендациям IUPAC 2005 (Red Book): анионные лиганды получают окончание
# «-идо» (cyanido, chlorido, hydroxido, fluorido), нейтральные сохраняют
# традиционные имена (ammine, aqua). Остальные основы — разговорные формы
# до 2005 года («циано», «хлоро», «гидроксо»); они поддержаны как алиасы,
# потому что диктуют по-прежнему так, но единственно верными не считаются.
# Подробности и оговорки — в docs/development/CHEMISTRY_NOMENCLATURE_RU.md.
ligands:
  - id: cyanido
    iupac_2005: цианидо
    stems: [цианидо, циано]
    formula: CN
    charge: -1
    max_multiplicity: 6
  - id: hydroxido
    iupac_2005: гидроксидо
    stems: [гидроксидо, гидроксо]
    formula: OH
    charge: -1
    max_multiplicity: 6
  - id: ammine
    iupac_2005: аммин
    stems: [аммин, амин]
    formula: NH3
    charge: 0
    max_multiplicity: 6
  - id: aqua
    iupac_2005: аква
    stems: [аква]
    formula: H2O
    charge: 0
    max_multiplicity: 6
  - id: chlorido
    iupac_2005: хлоридо
    stems: [хлоридо, хлоро]
    formula: Cl
    charge: -1
    max_multiplicity: 6
  - id: fluorido
    iupac_2005: фторидо
    stems: [фторидо, фторо]
    formula: F
    charge: -1
    max_multiplicity: 6

# Центральный атом в анионном комплексе назван латинской основой с суффиксом
# «-ат»: гексациано+ферр+ат. Основа здесь, суффикс — в коде.
anionic_centers:
  - stem: ферр
    symbol: Fe
  - stem: цинк
    symbol: Zn
  - stem: купр
    symbol: Cu
  - stem: алюмин
    symbol: Al
  - stem: станн
    symbol: Sn
  - stem: плюмб
    symbol: Pb
  - stem: аргент
    symbol: Ag
  - stem: аур
    symbol: Au

# Центральный атом в катионном комплексе назван русским именем в родительном
# падеже: тетраммин+меди. Формы берутся из elements.yaml, здесь только
# перечислены металлы, которым разрешено быть центром.
cationic_centers: [Fe, Cu, Zn, Ni, Co, Ag, Cr]

# Электрон полуреакции: «эф е два плюс минус электрон превращается в эф е
# три плюс». Живёт здесь, потому что это тоже компонент, из которого
# собирается частица, а не готовое вещество. Заряд у него всегда −1, и он
# не даёт ни одного атома — иначе сломался бы баланс по атомам.
electron_names: [электрон, электрона, электроном, электронов, электроны]

# Слова, после которых «ион» перестаёт быть обычным словом и вводит частицу.
ion_lead_ins: [ион, иона, ионом]

# Гидраты: «пентагидрат» = приставка + основа.
hydrate_stems: [гидрат, гидрата, гидратом]

# Способы назвать степень окисления. Голое число («меди два») уже понимается
# существующей грамматикой; здесь перечислены явные формулировки, которые
# ОДНОЗНАЧНО обозначают степень окисления и ничто иное.
oxidation_markers:
  - spoken: [плюс]
    sign: 1
  - spoken: [минус]
    sign: -1
  - spoken: [римское]
    sign: 1
  - spoken: [римская]
    sign: 1
  - spoken: [в, степени, окисления]
    sign: 1
  - spoken: [со, степенью, окисления]
    sign: 1
  - spoken: [степень, окисления]
    sign: 1

# Римские цифры, если распознаватель выдал их символами, а не словами.
roman_numerals:
  I: 1
  II: 2
  III: 3
  IV: 4
  V: 5
  VI: 6
  VII: 7
  VIII: 8
